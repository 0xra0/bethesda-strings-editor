name: Build and Deploy Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest commit's docs matter, so let a fresh push supersede an
# in-flight deploy instead of queueing behind it. Without this, a slow or stalled
# GitHub Pages backend makes every push stack a full 10-minute deploy-timeout
# behind the previous one (a pile-up of failed runs). Superseding a not-yet-live
# deploy is safe — the last successful deployment stays published until the new
# one flips over.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install app dependencies (needed for autodoc imports)
        run: pip install PySide6 requests

      - name: Install Sphinx dependencies
        run: pip install -r docs/requirements.txt

      - name: Build HTML docs
        env:
          QT_QPA_PLATFORM: offscreen
        run: sphinx-build -b html docs docs/_build/html -W --keep-going

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}

    steps:
      # GitHub's Pages backend intermittently answers the first status poll with
      # "Deployment failed, try again later." (a transient server-side error, not
      # a problem with the artifact or this workflow — the run log shows it fail
      # ~5s in, long before the 10-minute timeout). Retry once after a short
      # back-off before letting the run go red.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Back off before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
