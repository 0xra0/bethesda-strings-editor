name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to an exact version, unlike every other action here: ruff-action
      # ships immutable releases from v4 on and publishes no floating `v4` tag,
      # so `@v4` is not a valid ref. Bump this by hand.
      - uses: astral-sh/ruff-action@v4.1.0

  pyright:
    name: pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        # pytest is imported by tests/ so pyright needs it on the path to resolve the import
        run: pip install -r requirements.txt pytest pyright
      - uses: jakebailey/pyright-action@v3
        with:
          version: path
