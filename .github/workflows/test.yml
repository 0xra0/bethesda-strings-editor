name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          # The runner's pre-baked third-party Microsoft apt repos (azure-cli,
          # packages.microsoft.com) intermittently return 403, and apt-get update
          # fails the whole step (exit 100) when any single repo errors — even
          # though we only need the Ubuntu archive. Drop those repos first.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list
          grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -0r rm -f || true
          # Refresh the package index: the runner's pre-baked apt lists pin a
          # libegl-mesa0 point release that has since been superseded in the
          # archive, so a bare install 404s on the stale URL.
          sudo apt-get update
          sudo apt-get install -y libegl1 libhunspell-dev
          pip install hunspell

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          # PySide6 offscreen platform — no X11 server needed
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --tb=short

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest tests/ -v --tb=short
