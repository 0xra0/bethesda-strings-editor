name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Changelog ────────────────────────────────────────────────────────────────
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history required by git-cliff

      - uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: .cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      # Pass the notes to the release job as a file artifact, not a job output.
      # A large release body exceeds the per-env-var size limit and makes
      # softprops/action-gh-release fail to spawn node ("Argument list too long").
      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: CHANGES.md
          retention-days: 7

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: bethesda-strings-editor-linux-x64.zip
          - os: windows-latest
            artifact: bethesda-strings-editor-windows-x64.zip

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller (bootloader built from source)
        # The prebuilt PyInstaller wheel ships a bootloader whose exact bytes are
        # in many AV signature databases (the same wheel is used by real malware),
        # which is the single biggest driver of generic/ML false positives on
        # frozen apps. Compiling the bootloader from source produces unique bytes
        # that those signatures no longer match. The GitHub runners already have a
        # C toolchain (gcc on Linux, MSVC on Windows), so no extra setup is needed.
        run: pip install --no-binary pyinstaller "pyinstaller>=6.3"

      - name: Inject version from git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # strip leading 'v'
          echo "__version__ = '${VERSION}'" > _version.py
          echo "Building version ${VERSION}"

      - name: Compile Qt translations
        shell: bash
        run: |
          for ts in gui/translations/*.ts; do
            qm="${ts%.ts}.qm"
            pyside6-lrelease "$ts" -qm "$qm"
          done

      - name: Build with PyInstaller
        run: pyinstaller bethesda_strings_editor.spec

      # ── Windows code signing via SignPath Foundation (FREE for open source) ──
      # The SignPath Foundation signs OSS releases at no cost and is the real
      # long-term fix for the AV/SmartScreen warnings.  This project qualifies:
      # MIT (OSI-approved), publicly hosted, actively maintained, no proprietary
      # components.  One-time setup:
      #   1. Apply to the Foundation: https://signpath.org/  (terms:
      #      https://signpath.org/terms.html) — they issue a certificate and set
      #      up a project + signing policy in their SignPath.io tenant for you.
      #   2. Connect this GitHub repo and create the project/policy per
      #      https://docs.signpath.io/projects and https://docs.signpath.io/signing-code
      #   3. Add repo secret  SIGNPATH_API_TOKEN  and repo variables
      #      SIGNPATH_ORG_ID / SIGNPATH_PROJECT_SLUG / SIGNPATH_POLICY_SLUG.
      # Then uncomment the two steps below.  They run after the build and before
      # packaging, so the *signed* .exe is the one that gets zipped.  (Verify the
      # action's input names against its README — they evolve between majors.)
      #
      # - name: Upload unsigned exe for SignPath
      #   if: runner.os == 'Windows' && github.event_name == 'push'
      #   id: unsigned
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: unsigned-windows-exe
      #     path: dist/bethesda-strings-editor/bethesda-strings-editor.exe
      #
      # - name: Sign with SignPath
      #   if: runner.os == 'Windows' && github.event_name == 'push'
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORG_ID }}
      #     project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      #     signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
      #     github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist/bethesda-strings-editor/
      #
      # Linux ELF binaries cannot be Authenticode-signed; the GPG-signed
      # SHA256SUMS.asc produced by the release job already covers their integrity.

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r ../${{ matrix.artifact }} bethesda-strings-editor/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\bethesda-strings-editor\* -DestinationPath ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # ── Release ───────────────────────────────────────────────────────────────────
  # Requires one repository secret:
  #   GPG_PRIVATE_KEY  — base64-encoded armored private key
  #                      (gpg --armor --export-secret-keys KEYID | base64 -w0)
  #   (key has no passphrase — no GPG_PASSPHRASE secret needed)
  release:
    name: Create Release
    needs: [changelog, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          sha256sum *.zip > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback \
            --armor --detach-sign SHA256SUMS
          echo "--- Signature ---"
          gpg --verify SHA256SUMS.asc SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            SHA256SUMS
            SHA256SUMS.asc
          body_path: CHANGES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── NexusMods Upload ──────────────────────────────────────────────────────────
  # Requires three repository secrets:
  #   NEXUSMODS_API_KEY            — from https://www.nexusmods.com/users/myaccount?tab=api
  #   NEXUSMODS_FILE_GROUP_ID_LINUX   — Files tab → ⋯ → API Info on your mod page
  #   NEXUSMODS_FILE_GROUP_ID_WINDOWS — same, for the Windows file group
  nexusmods:
    name: Upload to NexusMods
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')

    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Install upload dependencies
        run: pip install requests

      - name: Upload to NexusMods
        env:
          NEXUSMODS_API_KEY: ${{ vars.NEXUSMODS_API_KEY }}
          NEXUSMODS_FILE_GROUP_ID_LINUX: ${{ vars.NEXUSMODS_FILE_GROUP_ID_LINUX }}
          NEXUSMODS_FILE_GROUP_ID_WINDOWS: ${{ vars.NEXUSMODS_FILE_GROUP_ID_WINDOWS }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/nexusmods_upload.py
