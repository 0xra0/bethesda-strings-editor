name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Rehearse a release: build, sign, and create a DRAFT release to prove the
          pipeline works. A draft is private to maintainers, notifies nobody, and
          creates no tag. NexusMods is never touched.
        type: boolean
        default: true

jobs:
  # ── Changelog ────────────────────────────────────────────────────────────────
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history required by git-cliff

      - uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: .cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      # Pass the notes to the release job as a file artifact, not a job output.
      # A large release body exceeds the per-env-var size limit and makes
      # softprops/action-gh-release fail to spawn node ("Argument list too long").
      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: CHANGES.md
          retention-days: 7

  # ── Build ─────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: bethesda-strings-editor-linux-x64.zip
          - os: windows-latest
            artifact: bethesda-strings-editor-windows-x64.zip

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller (bootloader built from source)
        # The prebuilt PyInstaller wheel ships a bootloader whose exact bytes are
        # in many AV signature databases (the same wheel is used by real malware),
        # which is the single biggest driver of generic/ML false positives on
        # frozen apps. Compiling the bootloader from source produces unique bytes
        # that those signatures no longer match. The GitHub runners already have a
        # C toolchain (gcc on Linux, MSVC on Windows), so no extra setup is needed.
        run: pip install --no-binary pyinstaller "pyinstaller>=6.3"

      - name: Inject version from git tag
        shell: bash
        run: |
          # On a dry run there is no tag — GITHUB_REF_NAME is the branch, which
          # would bake a version of "main" into the build.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"   # strip leading 'v'
          else
            VERSION="0.0.0-dryrun"
          fi
          echo "__version__ = '${VERSION}'" > _version.py
          echo "Building version ${VERSION}"

      - name: Compile Qt translations
        shell: bash
        run: |
          for ts in gui/translations/*.ts; do
            qm="${ts%.ts}.qm"
            pyside6-lrelease "$ts" -qm "$qm"
          done

      - name: Build with PyInstaller
        run: pyinstaller bethesda_strings_editor.spec

      # ── Windows code signing via SignPath Foundation (FREE for open source) ──
      # The SignPath Foundation signs OSS releases at no cost and is the real
      # long-term fix for the AV/SmartScreen warnings.  This project qualifies:
      # MIT (OSI-approved), publicly hosted, actively maintained, no proprietary
      # components.  One-time setup:
      #   1. Apply to the Foundation: https://signpath.org/  (terms:
      #      https://signpath.org/terms.html) — they issue a certificate and set
      #      up a project + signing policy in their SignPath.io tenant for you.
      #   2. Connect this GitHub repo and create the project/policy per
      #      https://docs.signpath.io/projects and https://docs.signpath.io/signing-code
      #   3. Add repo secret  SIGNPATH_API_TOKEN  and repo variables
      #      SIGNPATH_ORG_ID / SIGNPATH_PROJECT_SLUG / SIGNPATH_POLICY_SLUG.
      # Then uncomment the two steps below.  They run after the build and before
      # packaging, so the *signed* .exe is the one that gets zipped.  (Verify the
      # action's input names against its README — they evolve between majors.)
      #
      # - name: Upload unsigned exe for SignPath
      #   if: runner.os == 'Windows' && github.event_name == 'push'
      #   id: unsigned
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: unsigned-windows-exe
      #     path: dist/bethesda-strings-editor/bethesda-strings-editor.exe
      #
      # - name: Sign with SignPath
      #   if: runner.os == 'Windows' && github.event_name == 'push'
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORG_ID }}
      #     project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      #     signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
      #     github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: dist/bethesda-strings-editor/
      #
      # Linux ELF binaries cannot be Authenticode-signed; the GPG-signed
      # SHA256SUMS.asc produced by the release job already covers their integrity.

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r ../${{ matrix.artifact }} bethesda-strings-editor/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\bethesda-strings-editor\* -DestinationPath ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # ── Release ───────────────────────────────────────────────────────────────────
  # Repository secrets used for signing:
  #   GPG_PRIVATE_KEY  — base64-encoded armored private key, required
  #                      (gpg --armor --export-secret-keys KEYID | base64 -w0)
  #   GPG_PASSPHRASE   — the key's passphrase, if it has one. Optional: the
  #                      signing step reads it only when it is set, so a
  #                      passphrase-less key keeps working unchanged.
  release:
    name: Create Release
    needs: [changelog, build]
    runs-on: ubuntu-latest
    # Real releases come from a tag. A dry run also gets here — that is the whole
    # point, since it is the only way to exercise the publish step before it
    # matters — but it can only ever produce a draft (see the step below).
    # Dispatching with dry_run unchecked just builds and stops.
    if: startsWith(github.ref, 'refs/tags/') || inputs.dry_run
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          sha256sum *.zip > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Importing never needs the passphrase; only the signature does.
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --import
          if [ -n "$GPG_PASSPHRASE" ]; then
            # --passphrase-fd 0 rather than --passphrase: an argument would be
            # visible in the runner's process list for the life of the call.
            printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes \
              --pinentry-mode loopback --passphrase-fd 0 \
              --armor --detach-sign SHA256SUMS
          else
            gpg --batch --yes --pinentry-mode loopback \
              --armor --detach-sign SHA256SUMS
          fi
          echo "--- Signature ---"
          gpg --verify SHA256SUMS.asc SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
            SHA256SUMS
            SHA256SUMS.asc
          body_path: CHANGES.md
          # Anything not built from a tag is a rehearsal, so it can only be a
          # draft: private to maintainers, notifies nobody, and — importantly —
          # GitHub does not create the tag until a draft is published.
          draft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          # Without an explicit tag_name a dry run would inherit the *branch* name
          # and offer to tag it. Point it at an obviously disposable name instead.
          tag_name: >-
            ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name
                || format('dry-run-{0}', github.run_id) }}
          name: >-
            ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name
                || format('DRY RUN {0} — not a release', github.run_id) }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Fail loudly if the build produced no zips, rather than quietly
          # publishing a release with nothing attached to it.
          fail_on_unmatched_files: true

  # ── NexusMods Upload ──────────────────────────────────────────────────────────
  # Requires three repository secrets:
  #   NEXUSMODS_API_KEY            — from https://www.nexusmods.com/users/myaccount?tab=api
  #   NEXUSMODS_FILE_GROUP_ID_LINUX   — Files tab → ⋯ → API Info on your mod page
  #   NEXUSMODS_FILE_GROUP_ID_WINDOWS — same, for the Windows file group
  nexusmods:
    name: Upload to NexusMods
    needs: release
    runs-on: ubuntu-latest
    # This is the one irreversible, outward-facing step: it publishes a file to a
    # public mod page. It requires a real tag, so a dry run (which has no tag)
    # can never reach it, and the `-` guard keeps pre-releases off the mod page.
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')

    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Install upload dependencies
        run: pip install requests

      - name: Upload to NexusMods
        env:
          NEXUSMODS_API_KEY: ${{ vars.NEXUSMODS_API_KEY }}
          NEXUSMODS_FILE_GROUP_ID_LINUX: ${{ vars.NEXUSMODS_FILE_GROUP_ID_LINUX }}
          NEXUSMODS_FILE_GROUP_ID_WINDOWS: ${{ vars.NEXUSMODS_FILE_GROUP_ID_WINDOWS }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python scripts/nexusmods_upload.py
